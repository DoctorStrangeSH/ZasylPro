<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор тестовых данных</title>
</head>
<body>
    <h1>Генератор тестовых данных для проверки</h1>
    <button onclick="generateTestData()">Сгенерировать тестовые данные</button>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script>
        function generateTestData() {
            // Тестовые данные для заказов
            const orders = [
                {
                    'Номер грузоместа': 'GM-001',
                    'Номер заказа': 'ORD-001',
                    'Стоимость': 15000,
                    'Кто отправил': 'ООО "Поставщик 1"',
                    'Куда должны были отправить': 'Москва, ул. Ленина, 1',
                    'Зона сортировки': 'Зона А'
                },
                {
                    'Номер грузоместа': 'GM-002',
                    'Номер заказа': 'ORD-002',
                    'Стоимость': 25000,
                    'Кто отправил': 'ИП Иванов',
                    'Куда должны были отправить': 'Санкт-Петербург, Невский пр., 100',
                    'Зона сортировки': 'Зона Б'
                },
                {
                    'Номер грузоместа': 'GM-003',
                    'Номер заказа': 'ORD-003',
                    'Стоимость': 10000,
                    'Кто отправил': 'ООО "Поставщик 2"',
                    'Куда должны были отправить': 'Казань, ул. Баумана, 5',
                    'Зона сортировки': 'Зона А'
                }
            ];
            
            // Тестовые данные для засылов
            const zasyls = [
                {
                    'Номер заказа': 'ORD-001',
                    'Куда отправили засыл': 'Москва, ул. Пушкина, 10',
                    'ФИО засыльщика': 'Петров Петр Петрович',
                    'Дата засыла': '2024-01-15',
                    'Почему не засыл?': ''
                },
                {
                    'Номер заказа': 'ORD-003',
                    'Куда отправили засыл': 'Казань, ул. Баумана, 5',
                    'ФИО засыльщика': 'Сидоров Сидор Сидорович',
                    'Дата засыла': '2024-01-16',
                    'Почему не засыл?': ''
                }
            ];
            
            // Создаем Excel файлы
            const wb1 = XLSX.utils.book_new();
            const ws1 = XLSX.utils.json_to_sheet(orders);
            XLSX.utils.book_append_sheet(wb1, ws1, "Заказы");
            XLSX.writeFile(wb1, "test_orders.xlsx");
            
            const wb2 = XLSX.utils.book_new();
            const ws2 = XLSX.utils.json_to_sheet(zasyls);
            XLSX.utils.book_append_sheet(wb2, ws2, "Засылы");
            XLSX.writeFile(wb2, "test_zasyls.xlsx");
            
            alert('Тестовые файлы созданы! Скачайте их и загрузите в систему.');
        }
    </script>
</body>
</html>
